services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: search_app
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: semantic_search
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U search_app -d semantic_search"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://search_app:devpassword@postgres:5432/semantic_search
      REDIS_URL: redis://redis:6379/0
      EMBEDDING_PROVIDER: local
      EMBEDDING_DIM: "384"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./tests:/app/tests
      - ./app:/app/app
      - ./scripts:/app/scripts
volumes:
  pgdata:
